name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -q
      - name: Helm chart
        run: |
          curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz
          echo "c91e3d7293849eff3b4dc4ea7994c338bcc92f914864d38b5789bab18a1d775d  helm.tar.gz" | sha256sum -c
          tar -xzf helm.tar.gz
          linux-amd64/helm template sived charts/sived | cat >/tmp/sived.yaml
          test -s /tmp/sived.yaml
