{{- if and (not .Values.externalSecret.enabled) (not .Values.secrets.existingSecret) (or .Values.secrets.xaiApiKey .Values.secrets.llmApiKey .Values.secrets.extra) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sived.secretName" . }}
  labels:
    {{- include "sived.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.xaiApiKey }}
  XAI_API_KEY: {{ .Values.secrets.xaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
